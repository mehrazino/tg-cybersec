# .github/workflows/check-channels.yml
name: Check Telegram Channels Status

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run channel status checker
        run: python src/scripts/check_channels.py

      - name: Commit and push if changes occurred
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Channel Checker"
          git add src/data/channels.md
          git diff --staged --quiet || git commit -m "chore: auto-update channel statuses [skip ci]"
          git push
