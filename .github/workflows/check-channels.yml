name: Check Telegram Channels Status

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # Required to commit changes back to the repository
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run channel status checker
        run: python src/scripts/check_channels.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Channel Checker"
          git add src/data/channels.md
          git diff --staged --quiet || git commit -m "chore: auto-update channel statuses [skip ci]"
          git push
